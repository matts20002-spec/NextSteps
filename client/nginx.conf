# Serves the built static React app and reverse-proxies /api/* to the
# backend container over the internal Docker Compose network, so the
# frontend can call relative paths ('/api/...') the same way it will once
# CloudFront routes /api/* to the ALB in production. See client/src/api/config.js.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: let React Router handle unknown paths.
    location / {
        try_files $uri /index.html;
    }
}
